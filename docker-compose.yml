version: '3.8'

services:
  postgres_db:
    image: postgres:15
    container_name: bake_shop_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: bakeshop
    ports:
      - "5433:5432"
    volumes:
      - bake_shop_pg_data:/var/lib/postgresql/data

  pgadmin_web:
    image: dpage/pgadmin4
    container_name: bake_shop_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres_db

volumes:
  bake_shop_pg_data: